name: Homeserver image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homeserver-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  naming-overlay-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/homeserver/Dockerfile
          target: verification
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=artifacts/verification
          cache-from: type=gha,scope=homeserver-naming
          cache-to: type=gha,scope=homeserver-naming,mode=max
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naming-overlay-verification
          path: artifacts/verification
          if-no-files-found: warn
  publish:
    needs: naming-overlay-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tomerh2001/jellyfin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/homeserver/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=homeserver-naming
          cache-to: type=gha,scope=homeserver-naming,mode=max
